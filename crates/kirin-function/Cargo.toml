[package]
name = "kirin-function"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true, optional = true }
kirin = { workspace = true }
kirin-interpreter = { workspace = true, features = ["derive"] }
smallvec = { workspace = true }

[dev-dependencies]
