fail_fast = true
default_install_hook_types = ["pre-commit"]
default_stages = ["pre-commit"]

# Built-in hooks (native Rust, fast)
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "detect-private-key" },
  { id = "no-commit-to-branch", args = ["-b", "main"] },
]

# Rust: format check
[[repos]]
repo = "local"
[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
language = "system"
entry = "cargo +1.98.0 fmt --all -- --check"
pass_filenames = false
files = '(\.rs$|(^|/)Cargo\.toml$|^prek\.toml$)'

# Rust: check (catches errors clippy might miss with different feature flags)
[[repos]]
repo = "local"
[[repos.hooks]]
id = "cargo-check"
name = "cargo check"
language = "system"
entry = "cargo +1.98.0 check --workspace --all-targets --locked"
pass_filenames = false
files = '(\.rs$|(^|/)Cargo\.(toml|lock)$|^\.cargo/|^prek\.toml$)'

# Rust: clippy lint
[[repos]]
repo = "local"
[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
language = "system"
entry = "cargo +1.98.0 clippy --workspace --locked -- -D warnings"
pass_filenames = false
files = '(\.rs$|(^|/)Cargo\.(toml|lock)$|^\.cargo/|^prek\.toml$)'
