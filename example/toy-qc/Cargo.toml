[package]
rust-version.workspace = true
name = "toy-qc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "toy-qc"
path = "src/main.rs"

[dependencies]
serde = { workspace = true, optional = true }
kirin = { workspace = true }
kirin-ir = { workspace = true, features = ["derive"] }
kirin-chumsky = { workspace = true }
kirin-prettyless = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
kirin-test-utils = { workspace = true, features = ["roundtrip"] }
assert_cmd = { workspace = true }
predicates = { workspace = true }

[features]
serde = ["dep:serde", "kirin/serde", "kirin-test-utils/serde"]
